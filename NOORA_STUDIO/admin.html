<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOORA STUDIO | Admin</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"></head><body class="admin-body"><header class="admin-header"><a class="logo" href="index.html">NOORA <span>STUDIO</span><small>ADMIN PORTAL</small></a><a class="textlink" href="index.html">← Back to storefront</a></header><main class="admin-main"><section class="admin-panel"><p class="eyebrow">PRIVATE AREA</p><h1>Order <em>Dashboard</em></h1><p class="admin-lead">Sign in with the authorized admin account to view and update customer requests.</p><form id="loginForm" class="login-form"><label>Email<input type="email" name="email" required autocomplete="username" placeholder="Admin email"></label><label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Password"></label><button class="btn" id="loginBtn">Sign in ↗</button></form><p id="adminMessage" class="admin-message" role="status" aria-live="polite"></p><div id="dashboard" hidden><div class="dashboard-bar"><div><h2>Customer requests</h2><p id="orderCount">0 requests</p></div><div class="dashboard-actions"><button id="refreshBtn" class="plain-btn">Refresh</button><button id="logoutBtn" class="plain-btn">Sign out</button></div></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Interested item</th><th>Delivery / Payment</th><th>Status</th><th>Update</th></tr></thead><tbody id="ordersBody"></tbody></table></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
